name: Quality Checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 6.x
      - "release/*"
  pull_request:
    branches:
      - main
      - 6.x
      - "release/*"

jobs:
  tests:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        php_version: [8.2, 8.3, 8.4]
        database:
          - { name: mysql, version: "5.7", config: "ci.mysql.phpunit.xml" }
          - { name: mysql, version: "8.0", config: "ci.mysql.phpunit.xml" }
          - { name: mariadb, version: "10.5", config: "ci.mysql.phpunit.xml" }
          - { name: postgres, version: "13", config: "ci.pgsql.phpunit.xml" }

    services:
      db:
        image: ${{ matrix.database.name }}:${{ matrix.database.version }}
        ports:
          - ${{ matrix.database.name == 'postgres' && '5432:5432' || '3306:3306' }}
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: tenancy
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: tenancy
          options: >-
            --health-cmd="bash -c '
              if [[ ${{ matrix.database.name }} == \"mysql\" ]]; then
                mysqladmin ping -h localhost -u root -psecret;
              elif [[ ${{ matrix.database.name }} == \"mariadb\" ]]; then
                mysqladmin ping -h localhost -u root -prootpassword;
              elif [[ ${{ matrix.database.name }} == \"postgres\" ]]; then
                pg_isready -U postgres -d tenancy;
              fi'"
            --health-interval=10s
            --health-timeout=5s
            --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install PHP v${{ matrix.php_version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php_version }}
          extensions: mbstring, dom, fileinfo, mysql, pdo_pgsql, pdo_mysql, gd
          tools: composer:v2

      - name: Install PHP Dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Run PHPUnit Tests
        run: ./vendor/bin/phpunit -c ${{ matrix.database.config }}

      - name: Run PHPUnit Tests (Schema Mode) [Postgres Only]
        if: matrix.database.name == 'postgres'
        run: ./vendor/bin/phpunit -c ci.pgsql.phpunit.xml ./tests/unit-tests/Database/ConnectionTest.php
        env:
          TENANCY_DATABASE_DIVISION_MODE: schema
